<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect WhatsApp</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      .card {
        border: 1px solid #4444;
        border-radius: 12px;
        padding: 16px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      label {
        font-size: 14px;
        opacity: 0.9;
      }
      input,
      button,
      select {
        font: inherit;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #6665;
        background: transparent;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      .muted {
        font-size: 12px;
        opacity: 0.75;
      }
      .qr {
        display: grid;
        place-items: center;
        padding: 16px;
        border: 1px dashed #6666;
        border-radius: 12px;
        min-height: 280px;
        background: #00000008;
      }
      img.qr-img {
        width: 260px;
        height: 260px;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .hidden {
        display: none !important;
      }
      .status {
        margin-top: 8px;
        font-size: 13px;
      }
      .row.inline {
        grid-template-columns: 1fr auto;
        align-items: end;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Connect WhatsApp</h1>
        <a class="muted" href="/api-docs" target="_blank" rel="noreferrer"
          >API Docs</a
        >
      </header>

      <div class="card">
        <div class="row">
          <div class="row">
            <label for="baseUrl">API Base URL</label>
            <input id="baseUrl" placeholder="http://localhost:3000" />
          </div>
          <div class="row">
            <label for="token">Bearer Token</label>
            <input id="token" placeholder="Paste your JWT token" />
          </div>
          <div class="row inline">
            <div>
              <label for="name">Optional Session Name</label>
              <input id="name" placeholder="My WhatsApp Session" />
            </div>
            <button id="startBtn">Start Session</button>
          </div>
          <div class="status" id="status">Idle</div>
        </div>
      </div>

      <div class="card" style="margin-top: 16px">
        <div class="row">
          <div class="qr" id="qrBox">
            <span class="muted"
              >QR code will appear here after starting a session</span
            >
            <img id="qrImg" class="qr-img hidden" alt="QR Code" />
          </div>
          <div class="status" id="liveStatus"></div>
        </div>
      </div>
    </div>

    <!-- Load Socket.IO client from backend (self) to satisfy CSP -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- App logic (separate file, no inline scripts to satisfy CSP) -->
    <script src="/whatsapp-connect.js"></script>
  </body>
</html>
